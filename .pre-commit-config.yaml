repos:
  # ── Базовые проверки файлов ─────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  # ── Ruff (linter + isort) ───────────────────────────────
  # Только линт, без ruff-format — форматирование делает black (см. ниже),
  # чтобы два форматтера не спорили друг с другом и не гоняли diff туда-сюда.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]

  # ── Black ───────────────────────────────────────────────
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black

  # ── Mypy ────────────────────────────────────────────────
  # language: system — запускаем mypy из локального Poetry-окружения проекта,
  # а не в изолированном venv pre-commit. Так mypy видит все реальные зависимости
  # (celery, minio, pandas, openpyxl, reportlab, httpx и т.д.) без необходимости
  # дублировать их в additional_dependencies и без риска несовпадения архитектуры
  # бинарного пакета mypy (arm64/x86_64) в кэше pre-commit.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: poetry run mypy --config-file=pyproject.toml src
        language: system
        types: [python]
        exclude: ^(alembic/|tests/)
        pass_filenames: false

  # ── Bandit (security) ───────────────────────────────────
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.0
    hooks:
      - id: bandit
        args: [-c, pyproject.toml]
        exclude: ^tests/
