[tool.poetry]
name = "production-control"
version = "0.1.0"
description = "Система контроля заданий на выпуск продукции"
authors = []
readme = "README.md"
packages = []                    # плоская структура, пакет не устанавливаем

[tool.poetry.dependencies]
python = "^3.12"

# Web
fastapi = "^0.115"
uvicorn = { version = "^0.32", extras = ["standard"] }

# Database
sqlalchemy = { version = "^2.0", extras = ["asyncio"] }
asyncpg = "^0.30"
alembic = "^1.14"

# Validation / Config
pydantic = "^2.10"
pydantic-settings = "^2.7"

# Cache
redis = { version = "^5.2", extras = ["hiredis"] }

# Task queue
celery = { version = "^5.4", extras = ["redis"] }
kombu = "^5.4"                   # RabbitMQ transport

# Storage
minio = "^7.2"

# Logging
loguru = "^0.7"

# Excel / CSV / PDF
openpyxl = "^3.1"
pandas = "^2.2"
reportlab = "^4.2"

# HTTP (для webhook-клиента)
httpx = "^0.28"
greenlet = "^3.5.1"

[tool.poetry.group.dev.dependencies]
# Linters & formatters
ruff = "^0.8"
black = "^24.10"
mypy = "^1.13"
bandit = { version = "^1.8", extras = ["toml"] }

# Pre-commit
pre-commit = "^4.0"

# Testing
pytest = "^8.3"
pytest-asyncio = "^0.24"
pytest-cov = "^6.0"
httpx = "^0.28"          # async test client для FastAPI
factory-boy = "^3.3"

# Type stubs
types-redis = "^4.6"

# ── Ruff ─────────────────────────────────────────────────
pytest-mock = "^3.15.1"
[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line length — контролирует black
    "B008",  # do not perform function calls in default arguments (FastAPI Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

# ── Black ────────────────────────────────────────────────
[tool.black]
target-version = ["py312"]
line-length = 88

# ── Mypy ─────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/", "tests/"]
explicit_package_bases = true
mypy_path = "src"

# ── Bandit ───────────────────────────────────────────────
[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]   # assert в тестах — норма

# ── Pytest ───────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--cov=src --cov-report=term-missing -q"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
